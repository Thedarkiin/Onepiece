<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sail the Ocean — One Piece 3D Experience</title>
    <meta name="description" content="Sail the Going Merry across the ocean. A pure 3D sailing experience.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700&family=Lato:wght@300;400&display=swap"
        rel="stylesheet">
</head>

<body style="background:#000;margin:0;overflow:hidden">

    <!-- ═══ LOADER ═══ -->
    <div id="loader">
        <div class="loader-ring"></div>
        <div class="loader-text">LOADING ASSETS...</div>
        <div id="load-bar-container">
            <div id="load-fill"></div>
        </div>
    </div>

    <!-- ═══ INTRO ═══ -->
    <div id="intro-screen">
        <div class="intro-content">
            <h1 class="intro-title">SET SAIL</h1>
            <p class="intro-sub">A ONE PIECE EXPERIENCE</p>
            <button id="start-btn">⛵ SET SAIL</button>
        </div>
    </div>

    <!-- ═══ WEBGL CANVAS ═══ -->
    <div id="canvas-container" tabindex="0"></div>

    <!-- ═══ LIGHTNING FLASH OVERLAY ═══ -->
    <div id="lightning-flash"></div>

    <!-- ═══ HUD ═══ -->
    <div id="ui-layer">
        <div class="controls">
            <div class="btn-icon" id="theme-btn" title="Toggle Day/Night">☀️</div>

            <!-- Music controls -->
            <div class="music-controls">
                <span class="vol-icon">🎵</span>
                <input type="range" id="volume-slider" min="0" max="100" value="5">
                <button class="btn-track" id="track-btn" title="Switch Track">⏭</button>
                <span class="track-label" id="track-name">Bink's Sake</span>
            </div>
        </div>

        <div id="weather-widget">
            <div id="ww-status">STATUS: SUNRISE</div>
            <span id="ww-temp">TEMP: 14°C</span>
        </div>

        <!-- Nav hint -->
        <div id="nav-hint">
            <div class="nav-keys">
                <span class="key">W</span>
                <div class="nav-keys-row">
                    <span class="key">A</span>
                    <span class="key">S</span>
                    <span class="key">D</span>
                </div>
            </div>
            <span class="nav-label">SAIL THE OCEAN</span>
        </div>
    </div>

    <script type="module" src="/src/main.js"></script>
</body>

</html>
